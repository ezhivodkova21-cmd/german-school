# Разворачивается на российском сервере.
# Хранит все персональные данные пользователей (аккаунты, чаты, платежи).
services:
  ru-backend:
    build: ./ru-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ru-backend-data:/app
    restart: unless-stopped

volumes:
  ru-backend-data:
